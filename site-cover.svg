<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="60%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="redline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-width="0.3" opacity="0.06">
    <line x1="0" y1="104" x2="1200" y2="104"/>
    <line x1="0" y1="208" x2="1200" y2="208"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="416" x2="1200" y2="416"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="627"/>
    <line x1="400" y1="0" x2="400" y2="627"/>
    <line x1="600" y1="0" x2="600" y2="627"/>
    <line x1="800" y1="0" x2="800" y2="627"/>
    <line x1="1000" y1="0" x2="1000" y2="627"/>
  </g>

  <!-- Decorative circles top right -->
  <circle cx="1050" cy="120" r="180" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.12"/>
  <circle cx="1050" cy="120" r="120" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <circle cx="1050" cy="120" r="60" fill="#38bdf8" opacity="0.06"/>

  <!-- Bottom left decoration -->
  <circle cx="80" cy="550" r="120" fill="none" stroke="#f97316" stroke-width="1" opacity="0.1"/>
  <circle cx="80" cy="550" r="60" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.12"/>

  <!-- Top label -->
  <rect x="80" y="88" width="160" height="32" rx="16" fill="#38bdf8" opacity="0.15"/>
  <text x="160" y="109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">FIELD NOTES</text>

  <!-- Main title -->
  <text x="80" y="210" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#f8fafc" letter-spacing="-1">Agentic AI</text>
  <text x="80" y="295" font-family="Georgia, serif" font-size="58" font-weight="400" fill="url(#accent)" font-style="italic">&amp; Platform</text>
  <text x="80" y="375" font-family="Georgia, serif" font-size="58" font-weight="400" fill="url(#accent)" font-style="italic">Engineering</text>

  <!-- Red rule line -->
  <rect x="80" y="408" width="80" height="4" rx="2" fill="url(#redline)"/>

  <!-- Subtitle -->
  <text x="80" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8">What actually works.</text>

  <!-- Author block -->
  <circle cx="80" cy="535" r="28" fill="#0369a1"/>
  <text x="80" y="541" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="white">AU</text>
  <text x="122" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">Ashutosh Upadhyay</text>
  <text x="122" y="549" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Principal Engineer · J&amp;J Innovative Medicine · AWS · Kubernetes · Agentic AI</text>

  <!-- Right side tags -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
    <rect x="780" y="260" width="100" height="30" rx="15" fill="#38bdf8" opacity="0.15"/>
    <text x="830" y="280" text-anchor="middle" fill="#38bdf8">AWS</text>

    <rect x="896" y="260" width="130" height="30" rx="15" fill="#818cf8" opacity="0.15"/>
    <text x="961" y="280" text-anchor="middle" fill="#818cf8">Kubernetes</text>

    <rect x="780" y="306" width="100" height="30" rx="15" fill="#34d399" opacity="0.15"/>
    <text x="830" y="326" text-anchor="middle" fill="#34d399">GitOps</text>

    <rect x="896" y="306" width="130" height="30" rx="15" fill="#f472b6" opacity="0.15"/>
    <text x="961" y="326" text-anchor="middle" fill="#f472b6">Agentic AI</text>

    <rect x="780" y="352" width="110" height="30" rx="15" fill="#fb923c" opacity="0.15"/>
    <text x="835" y="372" text-anchor="middle" fill="#fb923c">Bioinformatics</text>

    <rect x="906" y="352" width="120" height="30" rx="15" fill="#a78bfa" opacity="0.15"/>
    <text x="966" y="372" text-anchor="middle" fill="#a78bfa">Multi-LLM</text>

    <rect x="780" y="398" width="246" height="30" rx="15" fill="#38bdf8" opacity="0.1"/>
    <text x="903" y="418" text-anchor="middle" fill="#94a3b8">Pharma R&amp;D · Drug Discovery</text>
  </g>

  <!-- URL watermark -->
  <text x="1180" y="610" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">aupadh12.github.io/enigmaAI</text>
</svg>