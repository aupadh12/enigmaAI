<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e"/>
      <stop offset="35%" style="stop-color:#1a0a3e"/>
      <stop offset="100%" style="stop-color:#0f0a1e"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="rgba(196,181,253,0.7)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(124,58,237,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="627" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <circle cx="700" cy="180" r="280" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="450" r="200" fill="#0d9488" opacity="0.08" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="150" fill="#d97706" opacity="0.07" filter="url(#glow)"/>

  <!-- Left panel: text -->
  <rect x="50" y="60" width="10" height="60" rx="5" fill="url(#gPurple)" opacity="0.9"/>
  <rect x="50" y="50" width="380" height="32" rx="6" fill="url(#gPurple)" opacity="0.15"/>
  <text x="70" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="rgba(196,181,253,0.9)" letter-spacing="2">MEMORY</text>

  <text x="50" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="white" letter-spacing="-1">Your Agent</text>
  <text x="50" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800" letter-spacing="-1">
    <tspan fill="#c4b5fd">Forgets</tspan>
    <tspan fill="white"> Everything</tspan>
  </text>
  <text x="50" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="white" letter-spacing="-1">Overnight</text>

  <text x="50" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="rgba(255,255,255,0.45)" style="max-width:380px">How cross-session memory works, why namespace</text>
  <text x="50" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="rgba(255,255,255,0.45)">scope matters more than storage, and which</text>
  <text x="50" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="rgba(255,255,255,0.45)">data should never persist at all.</text>

  <!-- Stats row -->
  <g transform="translate(50, 370)">
    <rect width="95" height="64" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(196,181,253,0.3)" stroke-width="1"/>
    <text x="47" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#c4b5fd">3</text>
    <text x="47" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1">STRATEGIES</text>

    <rect x="110" width="95" height="64" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(196,181,253,0.3)" stroke-width="1"/>
    <text x="157" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#c4b5fd">16</text>
    <text x="157" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1">CHAR ACTORID</text>

    <rect x="220" width="95" height="64" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(196,181,253,0.3)" stroke-width="1"/>
    <text x="267" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#c4b5fd">∞</text>
    <text x="267" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1">TTL IF WRONG</text>
  </g>

  <!-- Right panel: Architecture diagram -->
  <!-- Session 1 -->
  <rect x="480" y="60" width="200" height="140" rx="10" fill="rgba(124,58,237,0.08)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <rect x="480" y="60" width="200" height="28" rx="10" fill="url(#gPurple)" opacity="0.8"/>
  <rect x="480" y="80" width="200" height="8" fill="url(#gPurple)" opacity="0.8"/>
  <text x="580" y="78" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="white">SESSION 1</text>
  <text x="580" y="110" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="rgba(196,181,253,0.9)">User: "use Chronos scores"</text>
  <text x="580" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Session ends. History expires.</text>
  <text x="580" y="150" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(239,68,68,0.8)">Without memory: forgotten</text>
  <text x="580" y="188" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(196,181,253,0.6)">write_event()</text>

  <!-- Arrow down -->
  <line x1="580" y1="200" x2="580" y2="240" stroke="rgba(196,181,253,0.5)" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Memory Store -->
  <rect x="470" y="242" width="220" height="200" rx="10" fill="rgba(124,58,237,0.05)" stroke="rgba(167,139,250,0.3)" stroke-width="1.5"/>
  <rect x="470" y="242" width="220" height="28" rx="10" fill="url(#gPurple)" opacity="0.6"/>
  <rect x="470" y="262" width="220" height="8" fill="url(#gPurple)" opacity="0.6"/>
  <text x="580" y="260" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="white">AGENTCORE MEMORY</text>

  <!-- Strategies inside -->
  <rect x="482" y="284" width="196" height="36" rx="5" fill="rgba(124,58,237,0.12)" stroke="rgba(167,139,250,0.4)" stroke-width="1"/>
  <text x="580" y="300" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="rgba(196,181,253,0.9)">USER_PREFERENCE</text>
  <text x="580" y="313" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">/preferences/{actorId}/</text>

  <rect x="482" y="328" width="196" height="36" rx="5" fill="rgba(13,148,136,0.08)" stroke="rgba(45,212,191,0.3)" stroke-width="1"/>
  <text x="580" y="344" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="rgba(94,234,212,0.9)">EPISODIC</text>
  <text x="580" y="357" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">/findings/{actorId}/{sessionId}/</text>

  <rect x="482" y="372" width="196" height="36" rx="5" fill="rgba(217,119,6,0.08)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="580" y="388" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="rgba(253,230,138,0.9)">SEMANTIC</text>
  <text x="580" y="401" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">/corrections/{actorId}/</text>

  <!-- Arrow to session 2 -->
  <line x1="580" y1="444" x2="580" y2="484" stroke="rgba(196,181,253,0.5)" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="468" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(196,181,253,0.6)">retrieve()</text>

  <!-- Session 2 -->
  <rect x="470" y="486" width="220" height="110" rx="10" fill="rgba(13,148,136,0.08)" stroke="rgba(45,212,191,0.4)" stroke-width="1.5"/>
  <rect x="470" y="486" width="220" height="28" rx="10" fill="url(#gTeal)" opacity="0.7"/>
  <rect x="470" y="506" width="220" height="8" fill="url(#gTeal)" opacity="0.7"/>
  <text x="580" y="504" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="white">SESSION 2 (NEXT DAY)</text>
  <text x="580" y="530" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="rgba(94,234,212,0.9)">✓ Agent uses Chronos immediately</text>
  <text x="580" y="548" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Prior context loaded at session start</text>
  <text x="580" y="566" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">No re-teaching required</text>
  <text x="580" y="585" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="rgba(94,234,212,0.6)">actorId-scoped → no cross-user leaks</text>

  <!-- Namespace warning (right side) -->
  <rect x="730" y="60" width="220" height="120" rx="10" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.35)" stroke-width="1.5"/>
  <text x="840" y="90" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="rgba(252,165,165,0.9)">⚠ NAMESPACE TRAP</text>
  <text x="840" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">/omicsagent/ prefix</text>
  <text x="840" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">returns ALL users' data</text>
  <text x="840" y="152" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="rgba(252,165,165,0.8)">scope to {actorId}</text>
  <text x="840" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">sha256(email.lower())[:16]</text>

  <!-- No TTL warning -->
  <rect x="730" y="200" width="220" height="90" rx="10" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.35)" stroke-width="1.5"/>
  <text x="840" y="226" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="rgba(253,230,138,0.9)">NO AUTO-TTL</text>
  <text x="840" y="248" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Extracted records persist forever</text>
  <text x="840" y="266" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">eventExpiryDuration = raw events only</text>
  <text x="840" y="282" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(253,230,138,0.6)">Design writes carefully</text>

  <!-- 1-of-each rule -->
  <rect x="730" y="310" width="220" height="90" rx="10" fill="rgba(124,58,237,0.08)" stroke="rgba(167,139,250,0.3)" stroke-width="1.5"/>
  <text x="840" y="336" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="rgba(196,181,253,0.9)">1 OF EACH TYPE MAX</text>
  <text x="840" y="358" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Two USER_PREFERENCE → API error</text>
  <text x="840" y="376" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Use SEMANTIC for corrections</text>
  <text x="840" y="394" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(196,181,253,0.6)">USER_PREFERENCE for workflows</text>

  <!-- Fail-close -->
  <rect x="730" y="420" width="220" height="90" rx="10" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.3)" stroke-width="1.5"/>
  <text x="840" y="446" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="rgba(252,165,165,0.9)">FAIL CLOSE ON EMPTY ID</text>
  <text x="840" y="468" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">sha256("") = shared namespace</text>
  <text x="840" y="486" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">= permanent cross-user leak</text>
  <text x="840" y="504" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(252,165,165,0.7)">Raise ValueError, write nothing</text>

  <!-- Bottom bar -->
  <rect x="0" y="591" width="1200" height="36" fill="rgba(0,0,0,0.4)"/>
  <circle cx="30" cy="609" r="11" fill="url(#gPurple)"/>
  <text x="30" y="614" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="white">A</text>
  <text x="50" y="612" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.9)">Ashutosh Upadhyay</text>
  <text x="185" y="612" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">· Platform Engineering, J&amp;J Innovative Medicine</text>
  <rect x="1010" y="598" width="80" height="22" rx="11" fill="rgba(124,58,237,0.15)" stroke="rgba(196,181,253,0.2)" stroke-width="1"/>
  <text x="1050" y="613" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">AWS AgentCore</text>
  <rect x="1100" y="598" width="80" height="22" rx="11" fill="rgba(124,58,237,0.15)" stroke="rgba(196,181,253,0.2)" stroke-width="1"/>
  <text x="1140" y="613" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Memory</text>
</svg>
