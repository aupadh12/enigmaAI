  <text x="105" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="1">LEARNING</text>

  <!-- Title -->
  <text x="60" y="160" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="white">Closing the</text>
  <text x="60" y="196" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="white">Feedback</text>
  <text x="60" y="232" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fcd34d">Loop</text>

  <!-- Subtitle -->
  <text x="60" y="268" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">The user corrected it.</text>
  <text x="60" y="285" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">The next user didn't know.</text>

  <!-- Stats row -->
  <rect x="60" y="310" width="75" height="55" rx="6" fill="rgba(217,119,6,0.12)" stroke="rgba(252,211,77,0.2)"/>
  <text x="97" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#fcd34d">4</text>
  <text x="97" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">LAYERS</text>

  <rect x="147" y="310" width="75" height="55" rx="6" fill="rgba(217,119,6,0.12)" stroke="rgba(252,211,77,0.2)"/>
  <text x="184" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#fcd34d">≥3</text>
  <text x="184" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">THRESHOLD</text>

