  <rect x="490" y="68" width="660" height="68" rx="8" fill="rgba(220,38,38,0.08)" stroke="rgba(248,113,113,0.35)" stroke-width="1.5"/>
  <rect x="490" y="68" width="660" height="20" rx="8" fill="url(#lgD)" opacity="0.55"/>
