  <text x="664" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" font-weight="600">Haiku Clusters</text>
  <text x="664" y="492" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.35)">≥3 threshold</text>

  <line x1="736" y1="481" x2="756" y2="481" stroke="rgba(252,211,77,0.45)" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="758" y="460" width="140" height="42" rx="6" fill="rgba(217,119,6,0.1)" stroke="rgba(252,211,77,0.25)"/>
  <text x="828" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" font-weight="600">Admin Review</text>
  <text x="828" y="492" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.35)">Feedback Insights UI</text>

  <line x1="900" y1="481" x2="920" y2="481" stroke="rgba(252,211,77,0.45)" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="922" y="460" width="140" height="42" rx="6" fill="rgba(13,148,136,0.15)" stroke="rgba(45,212,191,0.35)"/>
  <text x="992" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="rgba(45,212,191,0.9)" font-weight="600">S3 Skill Update</text>
  <text x="992" y="492" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.35)">all users in ≤5 min</text>

  <!-- UI bug -->
  <rect x="430" y="520" width="720" height="44" rx="6" fill="rgba(220,38,38,0.08)" stroke="rgba(248,113,113,0.25)"/>
  <text x="790" y="539" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="rgba(252,165,165,0.85)">⚠  The UI Bug: 👎 auto-collapsed the comment bar</text>
  <text x="790" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">413 items · 2 thumbs-down · 3 comments · 0 with both → zero signal for months</text>

  <text x="820" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.15)">J&amp;J INNOVATIVE MEDICINE · PLATFORM ENGINEERING · 2026</text>
