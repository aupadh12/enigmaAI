  <text x="820" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">Admin updates skill → all users benefit within 5 minutes. No release needed.</text>
  <text x="820" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Scope: ALL users · Speed: ≤5 min cache TTL · Infra: S3 + admin UI</text>

  <line x1="820" y1="330" x2="820" y2="350" stroke="rgba(252,211,77,0.4)" stroke-width="1.5" marker-end="url(#arr)"/>

