  <rect x="455" y="163" width="730" height="68" rx="8" fill="rgba(124,58,237,0.08)" stroke="rgba(167,139,250,0.35)" stroke-width="1.5"/>
  <rect x="455" y="163" width="730" height="20" rx="8" fill="url(#lgB)" opacity="0.55"/>
