  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Grid -->
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="28" y2="0" stroke="rgba(217,119,6,0.04)" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="28" stroke="rgba(217,119,6,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="627" fill="url(#grid)"/>

  <!-- Ambient blobs -->
  <circle cx="900" cy="150" r="300" fill="#d97706" opacity="0.12" filter="url(#glow1)"/>
  <circle cx="500" cy="500" r="200" fill="#7c3aed" opacity="0.08" filter="url(#glow1)"/>

  <!-- Left panel -->
  <rect x="40" y="80" width="380" height="490" rx="12" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.04)"/>

