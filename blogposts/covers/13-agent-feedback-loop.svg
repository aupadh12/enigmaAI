  <text x="820" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">Systematic patterns → structured prompt improvement with eval gates.</text>
  <text x="820" y="409" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Scope: ALL users · Speed: hours (eval cycle) · Infra: eval harness required first</text>

