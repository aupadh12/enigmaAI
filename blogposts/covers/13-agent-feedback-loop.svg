  <text x="820" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">User says "no, use X". Agent adapts immediately for this session only.</text>
  <text x="820" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Scope: 1 session · Speed: instant · Infra: none</text>

  <line x1="820" y1="140" x2="820" y2="160" stroke="rgba(252,211,77,0.4)" stroke-width="1.5" marker-end="url(#arr)"/>

