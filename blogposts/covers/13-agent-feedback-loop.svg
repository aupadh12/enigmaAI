  <text x="820" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="white">LAYER 2 — PER-USER MEMORY (AgentCore)</text>
  <text x="820" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">Correction persists for that user across all future sessions.</text>
  <text x="820" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Scope: 1 user · Speed: ~25s extraction · Infra: AgentCore Memory</text>

  <line x1="820" y1="235" x2="820" y2="255" stroke="rgba(252,211,77,0.4)" stroke-width="1.5" marker-end="url(#arr)"/>

