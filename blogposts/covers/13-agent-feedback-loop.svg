  <text x="100" y="525" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.9)">Ashutosh Upadhyay</text>
  <text x="100" y="538" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">Platform Engineering · J&amp;J Innovative Medicine</text>

